name: CI
'on':
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: [self-hosted, swarma-ci]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.temp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1); console.log(process.version)"
      - run: npm ci
      - name: Chromium
        run: npx playwright install chromium
      - name: Python version
        run: python3 -c 'import sys; print(sys.version.split()[0]); assert sys.version_info[:2] == (3, 14)'
      - name: Contrast
        run: node scripts/run.mjs python3 scripts/check_contrast.py
      - name: Contrast negative control
        shell: bash
        run: |
          mkdir -p .temp
          set +e
          node scripts/run.mjs python3 scripts/check_contrast.py --control > .temp/contrast-control.log 2>&1
          control_status=$?
          set -e
          cat .temp/contrast-control.log
          test "$control_status" -eq 1
          grep -Eq '^FAIL light[[:space:]]+text-faint on bg[[:space:]]' .temp/contrast-control.log
      - name: Hygiene and link controls
        run: node scripts/run.mjs python3 -m unittest discover -s scripts/tests -v
      - name: Repository hygiene
        shell: bash
        env:
          IDENT_DENY_TOKENS: ${{ secrets.IDENT_DENY_TOKENS }}
        run: |
          node scripts/run.mjs python3 scripts/check_ci_tokens.py
          node scripts/run.mjs python3 scripts/check_hygiene.py
      - name: Markdown links
        run: node scripts/run.mjs python3 scripts/check_links.py
